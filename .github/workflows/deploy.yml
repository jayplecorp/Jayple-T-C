name: Build & Deploy to GitHub Pages

# corporate.jayple.in (company site). jayple.in itself is the customer web app on
# Firebase Hosting (Jayple repo: scripts/build_site.sh), which also serves the
# legal pages from this repo.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Next.js static export
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          cname: corporate.jayple.in
          commit_message: 'deploy: ${{ github.event.head_commit.message }}'
